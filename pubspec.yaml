name: xournalpp
description: A port of the main features of Xournal++ to various Flutter platforms like Android, iOS and the Web.

publish_to: none

version: 1.1.11+27

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker_cross: ^4.6.0
  flutter_math_fork: ^0.7.4
  intl: ^0.20.2
  archive: ^4.0.0
  xml: ^6.5.0
  url_launcher: ^6.3.0
  transparent_image: ^2.0.1
  receive_sharing_intent: ^1.8.1
  after_layout: ^1.2.0
  flutter_dropzone: ^4.2.0
  shared_preferences: ^2.2.2
  vector_math: ^2.1.4
  flutter_colorpicker: ^1.1.0
  package_info_plus: ^9.0.1
  printing: ^5.14.0
  pdf: ^3.11.0

  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  intl_utils: ^2.8.0

# file_picker_cross 4.6.0 (2022) pins pre-null-safety-era transitive versions.
# The overrides keep its call sites intact while updating to current APIs.
dependency_overrides:
  package_info_plus: ^9.0.1
  file_picker: ^8.0.0
  win32: ^5.5.3
  file: ^7.0.1
  # Local fork of file_picker_cross 4.6.0. The upstream package predates Dart 3
  # and uses the removed NullThrownError; the fork fixes the 3 throw sites.
  file_picker_cross:
    path: third_party/file_picker_cross

flutter_icons:
   android: true
   ios: true
   image_path: "assets/xournalpp.png"
   image_path_ios: "assets/xournalpp-solid.png"
   image_path_android: "assets/xournalpp-adaptive.png"
   adaptive_icon_background: "#673ab7"
   adaptive_icon_foreground: "assets/xournalpp-android.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Open Sans
      fonts:
        - asset: fonts/Open Sans/OpenSans-Regular.ttf
        - asset: fonts/Open Sans/OpenSans-Light.ttf
          weight: 300
        - asset: fonts/Open Sans/OpenSans-ExtraBold.ttf
          weight: 800
    - family: Glacial Indifference
      fonts:
        - asset: fonts/Glacial Indifference/GlacialIndifference-Regular.otf

flutter_intl:
  enabled: true
  class_name: S
  main_locale: en