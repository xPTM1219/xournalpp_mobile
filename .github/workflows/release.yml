name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{ print $2 }' | cut -f1 -d "+")
          cp build/app/outputs/flutter-apk/app-release.apk \
            "xournalpp-mobile-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: xournalpp-mobile-*.apk
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build runs in Docker (pinned Ubuntu 22.04 toolchain), so the
      # artifact matches the local build. See scripts/build-appimage.sh.
      - run: scripts/build-appimage.sh
      - run: scripts/test-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: xournalpp-mobile-*-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Attach artifacts to GitHub release
    needs: [build-apk, build-appimage]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/xournalpp-mobile-*.apk
            release/xournalpp-mobile-*-x86_64.AppImage
